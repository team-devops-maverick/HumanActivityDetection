[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HumanActivityDetection"
version = "1.0.0"
description = "Human Activity Detection using LSTM"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "Vinay" }
]

dependencies = [
    "build>=1.2.2.post1",
    "flask>=3.0.3",
    "setuptools>=75.3.4",
    "wheel>=0.45.1",
]

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["*"]
